[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cutvelvet"
version = "0.1.0"
description = "Layered strip compositor: JSON timelines -> ffmpeg"
requires-python = ">=3.9"
dependencies = ["numpy", "pillow"]

[project.scripts]
cutvelvet = "cutvelvet.cli:main"

[tool.setuptools]
packages = ["cutvelvet"]

[tool.setuptools.package-data]
cutvelvet = ["web/*", "web/**/*", "guide/*"]
